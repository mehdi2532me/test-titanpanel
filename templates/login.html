<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiTaN — ورود</title>

  <!-- CSS طراحی TiTaN -->
  <link rel="stylesheet" href="/static/css/titan-ui.css">
</head>

<body class="titan-auth">

  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="auth-page">

    <section class="auth-card">

      <!-- Brand -->
      <div class="brand-lockup">

        <div class="brand-mark">
          T
        </div>

        <div>
          <div class="brand-name">
            TiTaN
          </div>

          <div class="brand-caption">
            CONTROL PANEL
          </div>
        </div>

      </div>


      <!-- Heading -->
      <div class="auth-heading">

        <h1>
          خوش آمدید
        </h1>

        <p>
          برای ورود به پنل مدیریت TiTaN اطلاعات خود را وارد کنید.
        </p>

      </div>


      <!-- Login Form -->
      <form id="login-form" class="auth-form">

        <!-- Username -->
        <label class="field">

          <span>
            نام کاربری
          </span>

          <div class="input-wrap">

            <span class="input-icon">
              ◉
            </span>

            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="نام کاربری خود را وارد کنید"
              required
            >

          </div>

        </label>


        <!-- Password -->
        <label class="field">

          <span>
            رمز عبور
          </span>

          <div class="input-wrap">

            <span class="input-icon">
              ◆
            </span>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="رمز عبور خود را وارد کنید"
              required
            >

            <button
              class="password-toggle"
              type="button"
              aria-label="نمایش رمز"
            >
              ◉
            </button>

          </div>

        </label>


        <!-- Options -->
        <div class="auth-options">

          <label class="check-row">

            <input
              id="remember"
              type="checkbox"
            >

            <span class="check-box"></span>

            <span>
              مرا به خاطر بسپار
            </span>

          </label>


          <a
            href="#"
            class="text-link"
          >
            فراموشی رمز عبور؟
          </a>

        </div>


        <!-- Submit -->
        <button
          class="primary-btn auth-submit"
          type="submit"
        >

          <span>
            ورود به پنل
          </span>

          <span class="btn-arrow">
            ←
          </span>

        </button>


        <!-- Message -->
        <div
          id="login-message"
          class="form-message"
          hidden
        ></div>

      </form>


      <!-- Support -->
      <div class="auth-footer">

        <span>
          نیاز به کمک دارید؟
        </span>

        <a
          href="#"
          class="support-link"
        >
          پشتیبانی تلگرام
        </a>

      </div>


      <!-- Secure -->
      <div class="secure-note">

        <span class="secure-dot"></span>

        اتصال امن و رمزنگاری‌شده

      </div>

    </section>


    <footer class="auth-page-footer">

      <span>
        TiTaN Control Panel
      </span>

      <span>
        •
      </span>

      <span>
        Secure Administration
      </span>

    </footer>

  </main>


  <script>

    /*
      IMPORTANT:

      هنگام قرار دادن این UI داخل پروژه اصلی،
      منطق Login فعلی پروژه را حذف نکن.

      فقط HTML/CSS ظاهری این فایل را استفاده کن
      و event handler / API login فعلی پروژه را نگه دار.
    */


    const password =
      document.getElementById("password");

    const toggle =
      document.querySelector(".password-toggle");


    toggle.addEventListener("click", () => {

      const visible =
        password.type === "text";

      password.type =
        visible
          ? "password"
          : "text";

      toggle.setAttribute(
        "aria-label",
        visible
          ? "نمایش رمز"
          : "مخفی کردن رمز"
      );

    });


    /*
      نمونه نمایشی است.
      در پروژه اصلی این بخش را با Login API فعلی
      پروژه جایگزین/ادغام کن.
    */

    const form =
      document.getElementById("login-form");


    form.addEventListener("submit", (event) => {

      event.preventDefault();

      const message =
        document.getElementById("login-message");

      message.hidden = false;

      message.className =
        "form-message info";

      message.textContent =
        "منطق ورود فعلی پروژه را در این بخش نگه دارید.";

    });

  </script>

</body>
</html>
